<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Giới Thiệu Sinh Viên</title>
    <!-- Font chữ Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Thẻ Glassmorphism */
        .profile-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #fff;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .typing-text {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
            min-height: 24px;
            margin-bottom: 25px;
        }

        /* Danh sách thông tin cá nhân */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .info-item i {
            font-size: 18px;
            color: #a855f7;
            width: 24px;
            text-align: center;
        }

        .info-item .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .info-item .val {
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card" id="card">
        <!-- Chữ cái đầu tên làm Avatar -->
        <div class="avatar-box">
            <div class="avatar">N</div>
        </div>

        <!-- Tên -->
        <h1 class="name">Bùi Mai Quỳnh</h1>
        
        <!-- Hiệu ứng gõ chữ -->
        <div class="typing-text"><span id="typed"></span></div>

        <!-- Danh sách thông tin cá nhân -->
        <div class="info-list">
            <div class="info-item">
                <i class="fa-solid fa-cake-candles"></i>
                <div>
                    <span class="label">Tuổi</span>
                    <span class="val">21 Tuổi (2005)</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <span class="label">Nơi ở</span>
                    <span class="val">Sơn La, Việt Nam</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-graduation-cap"></i>
                <div>
                    <span class="label">Trạng thái</span>
                    <span class="val">Sinh viên Đại học Hải Phòng</span>
                </div>
            </div>

            <div class="info-item">
                <i class="fa-solid fa-code"></i>
                <div>
                    <span class="label">Ngành học</span>
                    <span class="val">Công nghệ Thông tin</span>
                </div>
            </div>
        </div>

        <!-- Nút bấm -->
        <a href="https://facebook.com" target="_blank" class="social-btn">
            <i class="fa-brands fa-facebook"></i> Liên hệ Facebook
        </a>
    </div>

    <!-- Thư viện hiệu ứng Chữ Gõ & Tilt 3D miễn phí -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        // Cấu hình hiệu ứng gõ chữ
        new Typed('#typed', {
            strings: ['Sinh viên IT', 'Đam mê Lập trình', 'Thích Học Hỏi Công Nghệ'],
            typeSpeed: 60,
            backSpeed: 40,
            loop: true
        });

        // Cấu hình hiệu ứng nghiêng thẻ 3D theo chuột
        VanillaTilt.init(document.querySelector("#card"), {
            max: 12,
            speed: 400,
            glare: true,
            "max-glare": 0.2
        });
    </script>
</body>
</html>
